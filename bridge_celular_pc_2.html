<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esteira Seletora IA (v2) — Visualização Ao Vivo & ESP32</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --card-2: #1f2937;
      --border: #374151;
      --text: #f9fafb;
      --muted: #9ca3af;
      --piramide: #f59e0b;
      --cubo: #10b981;
      --outros: #6b7280;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }
    .box {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h1 { font-size: 1.15rem; }
    .video-box {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--border);
    }
    video { width: 100%; height: 100%; object-fit: contain; }
    .hud {
      background: var(--card-2);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hud.y-0 { border-color: var(--piramide); }
    .hud.y-1 { border-color: var(--cubo); }
    .hud.y--1 { border-color: var(--outros); }
    .hud-title { font-size: 1.45rem; font-weight: 800; }
    .y-0 .hud-title { color: var(--piramide); }
    .y-1 .hud-title { color: var(--cubo); }
    .y--1 .hud-title { color: #d1d5db; }
    label { font-size: 0.84rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; font-weight: 600; }
    input, select {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    button {
      cursor: pointer;
      background: #16a34a;
      color: #fff;
      border: 1px solid #15803d;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .log {
      background: #05070c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      height: 150px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.78rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Esteira Seletora IA — Vídeo Ao Vivo & ESP32</h1>

    <label>IP da ESP32 (Hotspot do Celular)
      <input type="text" id="espIp" value="192.168.43.100" placeholder="Ex.: 192.168.43.100" />
    </label>

    <label>Câmera (Camo / Celular / Webcam)
      <select id="camSel"></select>
    </label>

    <button id="btnStart">▶ Iniciar Câmera + Leitura Ao Vivo + Esteira</button>

    <div class="video-box">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
    </div>

    <div id="hud" class="hud y--1">
      <div>
        <div id="hudMode" style="font-size:0.75rem;color:var(--muted);">LEITURA AO VIVO</div>
        <div id="hudClass" class="hud-title">AGUARDANDO...</div>
        <div id="hudAction" style="font-size:0.82rem;color:var(--muted);">Ação: --</div>
      </div>
      <div style="text-align:right;">
        <div id="hudConf" style="font-size:1.35rem;font-weight:800;">--%</div>
        <div id="hudY" style="font-size:0.8rem;color:var(--muted);">y = --</div>
      </div>
    </div>

    <div id="log" class="log"></div>
  </div>

  <script>
    const API_URL = "https://projeto-harduino-ia.onrender.com";
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const camSel = document.getElementById("camSel");
    const espInput = document.getElementById("espIp");
    const logEl = document.getElementById("log");

    let stream = null;
    let active = false;
    let busyPredict = false;
    let busyTrigger = false;
    let busyStatus = false;
    let lastDecisaoAt = 0;

    if (localStorage.getItem("harduino_esp_ip")) {
      espInput.value = localStorage.getItem("harduino_esp_ip").replace(/^https?:\/\//i, "");
    }
    espInput.addEventListener("input", () => localStorage.setItem("harduino_esp_ip", espInput.value.trim()));

    function cleanEsp() {
      let u = espInput.value.trim().replace(/\/+$/, "");
      return /^https?:\/\//i.test(u) ? u : "http://" + u;
    }
    function log(msg, color = "#93c5fd") {
      const d = document.createElement("div");
      d.style.color = color;
      d.textContent = `[${new Date().toLocaleTimeString("pt-BR", { hour12: false })}] ${msg}`;
      logEl.prepend(d);
    }

    async function loadCams() {
      try {
        const devs = await navigator.mediaDevices.enumerateDevices();
        const vids = devs.filter(d => d.kind === "videoinput");
        camSel.innerHTML = "";
        vids.forEach((d, i) => {
          const o = document.createElement("option");
          o.value = d.deviceId;
          o.textContent = d.label || `Câmera ${i + 1}`;
          camSel.appendChild(o);
        });
        const camo = vids.find(d => /camo/i.test(d.label));
        if (camo) camSel.value = camo.deviceId;
      } catch (e) {}
    }

    async function startCam() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      const id = camSel.value;
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: id ? { deviceId: { exact: id } } : { facingMode: "environment" }
      });
      video.srcObject = stream;
      await video.play();
      await loadCams();
      log("Câmera e leitura ao vivo iniciadas!", "#34d399");
    }

    function captureBlob() {
      return new Promise((resolve, reject) => {
        if (!stream || video.readyState < 2) return reject(new Error("Câmera não iniciada"));
        ctx.drawImage(video, 0, 0, 320, 240);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error("Erro JPEG")), "image/jpeg", 0.85);
      });
    }

    async function predictFrame(label = "LEITURA AO VIVO", waitIfBusy = false) {
      if (busyPredict) {
        if (!waitIfBusy) return null;
        const t0 = Date.now();
        while (busyPredict && Date.now() - t0 < 4000) await new Promise(r => setTimeout(r, 50));
      }
      busyPredict = true;
      try {
        const blob = await captureBlob();
        const fd = new FormData();
        fd.append("file", blob, "frame.jpg");
        const r = await fetch(`${API_URL}/predict`, { method: "POST", body: fd });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();

        const hud = document.getElementById("hud");
        hud.className = `hud y-${data.y}`;
        document.getElementById("hudMode").textContent = label;
        document.getElementById("hudClass").textContent = (data.classe || "").toUpperCase();
        document.getElementById("hudAction").textContent = `Ação: ${data.acao}`;
        document.getElementById("hudConf").textContent = `${((data.confianca || 0) * 100).toFixed(1)}%`;
        document.getElementById("hudY").textContent = `y = ${data.y}`;
        return data;
      } catch (e) {
        return null;
      } finally {
        busyPredict = false;
      }
    }

    setInterval(async () => {
      if (!active || !stream || busyTrigger || busyPredict) return;
      await predictFrame("LEITURA AO VIVO (CONTÍNUA)", false);
    }, 700);

    setInterval(async () => {
      if (!active || busyStatus || busyTrigger || (Date.now() - lastDecisaoAt < 1800)) return;
      busyStatus = true;
      try {
        const r = await fetch(`${cleanEsp()}/status`);
        if (r.ok) {
          const st = await r.json();
          if (st.peca_detectada === true) {
            busyTrigger = true;
            log("Peça detectada na esteira! Classificando...", "#fbbf24");
            const pred = await predictFrame("PEÇA NA ESTEIRA → ESP32", true);
            if (pred) {
              await fetch(`${cleanEsp()}/decisao`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  classe: pred.classe,
                  y: Number(pred.y),
                  acao: pred.acao,
                  confianca: Number(pred.confianca ?? 1.0)
                })
              });
              lastDecisaoAt = Date.now();
              log(`Decisão enviada: ${pred.classe.toUpperCase()} (y=${pred.y})`, "#34d399");
            }
          }
        }
      } catch (e) {
      } finally {
        busyStatus = false;
        busyTrigger = false;
      }
    }, 400);

    document.getElementById("btnStart").onclick = async (e) => {
      await startCam();
      active = true;
      e.target.textContent = "✔ Sistema Ativo (Ao Vivo + Esteira)";
    };
    camSel.onchange = () => { if (stream) startCam(); };
    loadCams();
  </script>
</body>
</html>
