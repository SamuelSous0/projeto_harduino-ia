<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ponte Esteira IA v2 — Visualização Ao Vivo & Controle ESP32</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --card-2: #1f2937;
      --border: #374151;
      --text: #f9fafb;
      --muted: #9ca3af;
      --piramide: #f59e0b;
      --cubo: #10b981;
      --outros: #6b7280;
      --accent: #3b82f6;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }
    .top-bar {
      max-width: 1180px;
      margin: 0 auto 14px auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .top-bar h1 { font-size: 1.15rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--card-2);
      border: 1px solid var(--border);
      font-weight: 600;
    }
    .badge.ok { border-color: #10b981; color: #34d399; }
    .badge.warn { border-color: #f59e0b; color: #fbbf24; }
    .badge.err { border-color: #ef4444; color: #f87171; }

    .layout {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 14px;
    }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--border);
    }
    video { width: 100%; height: 100%; object-fit: contain; }
    .hud-result {
      background: var(--card-2);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hud-result.y-0 { border-color: var(--piramide); }
    .hud-result.y-1 { border-color: var(--cubo); }
    .hud-result.y--1 { border-color: var(--outros); }
    .hud-title { font-size: 1.5rem; font-weight: 800; }
    .y-0 .hud-title { color: var(--piramide); }
    .y-1 .hud-title { color: var(--cubo); }
    .y--1 .hud-title { color: #d1d5db; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
    label { font-size: 0.78rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
    input, select {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      cursor: pointer;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.84rem;
      font-weight: 600;
    }
    button.primary { background: var(--accent); border-color: #2563eb; }
    button.green { background: #059669; border-color: #047857; }
    button.amber { background: #d97706; border-color: #b45309; }
    button.red { background: #dc2626; border-color: #b91c1c; }

    .log {
      background: #05070c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      height: 220px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.77rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>Ponte Esteira Seletora IA (v2 Compacta) — Vídeo Ao Vivo + ESP32</h1>
    <div class="badges">
      <span id="bApi" class="badge">API: --</span>
      <span id="bLive" class="badge">Ao Vivo: Parado</span>
      <span id="bEsp" class="badge">ESP32: Parado</span>
    </div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="video-box">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
      </div>

      <div id="hud" class="hud-result y--1">
        <div>
          <div id="hudMode" style="font-size:0.75rem;color:var(--muted);">AGUARDANDO LEITURA AO VIVO</div>
          <div id="hudClass" class="hud-title">--</div>
          <div id="hudAction" style="font-size:0.82rem;color:var(--muted);">Ação: --</div>
        </div>
        <div style="text-align:right;">
          <div id="hudConf" style="font-size:1.4rem;font-weight:800;">--%</div>
          <div id="hudY" style="font-size:0.8rem;color:var(--muted);">y = --</div>
        </div>
      </div>

      <div class="row">
        <label>Câmera (Camo / Celular / USB)
          <select id="camSel"></select>
        </label>
        <label>Intervalo Leitura Ao Vivo (ms)
          <input type="number" id="liveMs" value="700" min="250" max="5000" step="50" />
        </label>
      </div>

      <div class="btns">
        <button id="btnCam" class="primary">1. Ligar Câmera</button>
        <button id="btnLive" class="green">2. Leitura Contínua Ao Vivo</button>
        <button id="btnOnce">Ler Frame Agora</button>
      </div>
    </div>

    <div class="panel">
      <div class="row">
        <label>URL da API (Render / FastAPI)
          <input type="text" id="apiUrl" value="https://projeto-harduino-ia.onrender.com" />
        </label>
        <label>IP da ESP32 (Hotspot do Celular)
          <input type="text" id="espIp" value="http://192.168.43.100" />
        </label>
      </div>

      <div class="row">
        <label>Polling GET /status (ms)
          <input type="number" id="pollMs" value="400" min="150" max="3000" />
        </label>
        <label>Cooldown após POST /decisao (ms)
          <input type="number" id="coolMs" value="1800" min="500" max="8000" />
        </label>
      </div>

      <div class="btns">
        <button id="btnEsp" class="amber">3. Monitorar Sensor ESP32 (GET /status)</button>
        <button id="btnForceTrigger">Capturar + Enviar POST /decisao</button>
      </div>

      <div class="btns">
        <button id="btnPir">Teste Pirâmide (y=0)</button>
        <button id="btnCub">Teste Cubo (y=1)</button>
        <button id="btnReto">Teste Passar Reto (y=-1)</button>
      </div>

      <div id="log" class="log"></div>
    </div>
  </div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const camSel = document.getElementById("camSel");
    const apiInput = document.getElementById("apiUrl");
    const espInput = document.getElementById("espIp");
    const liveMsInput = document.getElementById("liveMs");
    const pollMsInput = document.getElementById("pollMs");
    const coolMsInput = document.getElementById("coolMs");
    const logEl = document.getElementById("log");

    let stream = null;
    let liveOn = false, liveTimer = null;
    let espOn = false, espTimer = null;
    let inFlightPredict = false;
    let inFlightTrigger = false;
    let inFlightStatus = false;
    let lastDecisaoAt = 0;

    const qs = new URLSearchParams(location.search);
    if (qs.get("api") || localStorage.getItem("harduino_api_url")) {
      apiInput.value = qs.get("api") || localStorage.getItem("harduino_api_url");
    }
    if (qs.get("esp") || localStorage.getItem("harduino_esp_ip")) {
      espInput.value = qs.get("esp") || localStorage.getItem("harduino_esp_ip");
    }
    apiInput.addEventListener("change", () => localStorage.setItem("harduino_api_url", cleanApi()));
    espInput.addEventListener("change", () => localStorage.setItem("harduino_esp_ip", cleanEsp()));

    function cleanApi() {
      let u = apiInput.value.trim().replace(/\/+$/, "");
      return /^https?:\/\//i.test(u) ? u : "https://" + u;
    }
    function cleanEsp() {
      let u = espInput.value.trim().replace(/\/+$/, "");
      return /^https?:\/\//i.test(u) ? u : "http://" + u;
    }
    function log(msg, color = "#93c5fd") {
      const d = document.createElement("div");
      d.style.color = color;
      d.textContent = `[${new Date().toLocaleTimeString("pt-BR", { hour12: false })}] ${msg}`;
      logEl.prepend(d);
    }

    async function checkHealth() {
      try {
        const r = await fetch(`${cleanApi()}/health`);
        const j = await r.json();
        const b = document.getElementById("bApi");
        if (r.ok && j.modelo_carregado) {
          b.textContent = "API: Modelo OK";
          b.className = "badge ok";
          log(`API online (${j.num_classes} classes, modelo_carregado=true)`, "#34d399");
        } else {
          b.textContent = "API: Sem Modelo";
          b.className = "badge warn";
        }
      } catch (e) {
        const b = document.getElementById("bApi");
        b.textContent = "API: Offline";
        b.className = "badge err";
      }
    }

    async function loadCams() {
      const devs = await navigator.mediaDevices.enumerateDevices();
      const vids = devs.filter(d => d.kind === "videoinput");
      camSel.innerHTML = "";
      vids.forEach((d, i) => {
        const o = document.createElement("option");
        o.value = d.deviceId;
        o.textContent = d.label || `Câmera ${i + 1}`;
        camSel.appendChild(o);
      });
      const camo = vids.find(d => /camo/i.test(d.label));
      if (camo) camSel.value = camo.deviceId;
    }

    async function startCam() {
      if (stream) stream.getTracks().forEach(t => t.stop());
      const id = camSel.value;
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: id ? { deviceId: { exact: id } } : { facingMode: "environment" }
      });
      video.srcObject = stream;
      await video.play();
      await loadCams();
      log("Câmera iniciada (captura JPEG 320x240).", "#34d399");
    }

    function captureBlob() {
      return new Promise((resolve, reject) => {
        if (!stream || video.readyState < 2) return reject(new Error("Câmera não iniciada"));
        ctx.drawImage(video, 0, 0, 320, 240);
        canvas.toBlob(b => b ? resolve(b) : reject(new Error("Erro JPEG")), "image/jpeg", 0.85);
      });
    }

    async function predictFrame(label = "LEITURA AO VIVO", waitIfBusy = false) {
      if (inFlightPredict) {
        if (!waitIfBusy) return null;
        const t0 = Date.now();
        while (inFlightPredict && Date.now() - t0 < 4000) {
          await new Promise(r => setTimeout(r, 50));
        }
      }
      inFlightPredict = true;
      try {
        const blob = await captureBlob();
        const fd = new FormData();
        fd.append("file", blob, "frame.jpg");
        const r = await fetch(`${cleanApi()}/predict`, { method: "POST", body: fd });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();

        const hud = document.getElementById("hud");
        hud.className = `hud-result y-${data.y}`;
        document.getElementById("hudMode").textContent = label;
        document.getElementById("hudClass").textContent = `${(data.classe || "").toUpperCase()}`;
        document.getElementById("hudAction").textContent = `Ação: ${data.acao}`;
        document.getElementById("hudConf").textContent = `${((data.confianca || 0) * 100).toFixed(1)}%`;
        document.getElementById("hudY").textContent = `y = ${data.y}`;
        return data;
      } catch (e) {
        log(`Erro /predict: ${e.message}`, "#f87171");
        return null;
      } finally {
        inFlightPredict = false;
      }
    }

    async function liveLoop() {
      if (!liveOn) return;
      if (!inFlightTrigger && !inFlightPredict) {
        await predictFrame("LEITURA CONTÍNUA AO VIVO", false);
      }
      if (liveOn) {
        liveTimer = setTimeout(liveLoop, Math.max(250, Number(liveMsInput.value) || 700));
      }
    }

    async function sendDecisao(pred) {
      const payload = {
        classe: pred.classe,
        y: Number(pred.y),
        acao: pred.acao,
        confianca: Number(pred.confianca ?? 1.0)
      };
      const r = await fetch(`${cleanEsp()}/decisao`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!r.ok) throw new Error(`POST /decisao HTTP ${r.status}`);
      lastDecisaoAt = Date.now();
      log(`POST /decisao enviado -> y=${payload.y} (${payload.classe})`, "#34d399");
    }

    async function processBeltPiece() {
      if (inFlightTrigger) return;
      inFlightTrigger = true;
      try {
        log("Peça detectada na esteira (peca_detectada=true)! Classificando...", "#fbbf24");
        const pred = await predictFrame("PEÇA NA ESTEIRA → DECISÃO ESP32", true);
        if (pred) await sendDecisao(pred);
      } catch (e) {
        log(`Falha no ciclo da esteira: ${e.message}`, "#f87171");
      } finally {
        inFlightTrigger = false;
      }
    }

    async function espLoop() {
      if (!espOn) return;
      const cool = Math.max(500, Number(coolMsInput.value) || 1800);
      if (!inFlightStatus && !inFlightTrigger && (Date.now() - lastDecisaoAt > cool)) {
        inFlightStatus = true;
        try {
          const r = await fetch(`${cleanEsp()}/status`);
          if (r.ok) {
            const st = await r.json();
            const b = document.getElementById("bEsp");
            b.textContent = st.peca_detectada ? "ESP32: Peça Detectada!" : "ESP32: Esteira Livre";
            b.className = st.peca_detectada ? "badge warn" : "badge ok";
            if (st.peca_detectada === true) {
              await processBeltPiece();
            }
          }
        } catch (e) {
          const b = document.getElementById("bEsp");
          b.textContent = "ESP32: Sem conexão";
          b.className = "badge err";
        } finally {
          inFlightStatus = false;
        }
      }
      if (espOn) {
        espTimer = setTimeout(espLoop, Math.max(150, Number(pollMsInput.value) || 400));
      }
    }

    document.getElementById("btnCam").onclick = startCam;
    document.getElementById("btnOnce").onclick = () => predictFrame("LEITURA MANUAL", true);
    document.getElementById("btnLive").onclick = async (e) => {
      if (!stream) await startCam();
      liveOn = !liveOn;
      if (liveTimer) clearTimeout(liveTimer);
      e.target.textContent = liveOn ? "Pausar Leitura Ao Vivo" : "2. Leitura Contínua Ao Vivo";
      e.target.className = liveOn ? "red" : "green";
      const b = document.getElementById("bLive");
      b.textContent = liveOn ? "Ao Vivo: Ativo" : "Ao Vivo: Parado";
      b.className = liveOn ? "badge ok" : "badge";
      if (liveOn) liveLoop();
    };
    document.getElementById("btnEsp").onclick = (e) => {
      espOn = !espOn;
      if (espTimer) clearTimeout(espTimer);
      e.target.textContent = espOn ? "Parar Monitoramento ESP32" : "3. Monitorar Sensor ESP32 (GET /status)";
      e.target.className = espOn ? "red" : "amber";
      if (espOn) espLoop();
    };
    document.getElementById("btnForceTrigger").onclick = processBeltPiece;
    document.getElementById("btnPir").onclick = () => sendDecisao({ classe: "piramide", y: 0, acao: "desviar_piramide", confianca: 1 });
    document.getElementById("btnCub").onclick = () => sendDecisao({ classe: "cubo", y: 1, acao: "desviar_cubo", confianca: 1 });
    document.getElementById("btnReto").onclick = () => sendDecisao({ classe: "nao_reconhecido", y: -1, acao: "passar_reto", confianca: 1 });

    loadCams();
    checkHealth();
  </script>
</body>
</html>
